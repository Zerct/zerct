# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
enable_free_tier: true
inheritance: false
tone_instructions: "Be direct and strict. Focus on correctness, security, performance, resource use, and maintainability."

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_details: true
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  path_filters:
    - "!**/target/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.terraform/**"
    - "!**/*.tgz"
  path_instructions:
    - path: "**/*.rs"
      instructions: "Treat unsafe code, panics in request paths, unbounded concurrency, missing resource limits, and weak error responses as high priority findings."
    - path: "packages/zerct/bin/zerct.js"
      instructions: "Review CLI behavior for agent-ready errors, secret redaction, archive excludes, and stable JSON output."
    - path: "docs/**"
      instructions: "Review docs for launched behavior only, copy-pasteable commands, short prose, and agent-readable failure recovery."
    - path: ".github/workflows/**"
      instructions: "Review workflows for least privilege permissions, Blacksmith runners, secret safety, and unnecessary work."
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - main
    ignore_title_keywords:
      - wip
      - draft
  tools:
    github-checks:
      enabled: true
      timeout_ms: 900000
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    checkov:
      enabled: true
    tflint:
      enabled: true
    semgrep:
      enabled: true
    osvScanner:
      enabled: true
    clippy:
      enabled: true
    eslint:
      enabled: true
    ruff:
      enabled: true
    flake8:
      enabled: true

chat:
  art: false
  allow_non_org_members: false
  auto_reply: false
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - docs/AGENTS.md
      - README.md
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled

code_generation:
  docstrings:
    path_instructions: []
  unit_tests:
    path_instructions: []

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
  auto_planning:
    enabled: false
