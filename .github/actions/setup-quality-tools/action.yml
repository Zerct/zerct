name: Set up pinned quality tools
description: Install the exact public repository lint, audit, and formatting toolchain.

runs:
  using: composite
  steps:
    - name: Install pinned Cargo quality tools
      shell: bash
      run: |
        set -euo pipefail
        tool_root="$RUNNER_TEMP/tovuk-quality-tools"
        mkdir -p "$tool_root"
        cargo install --locked --root "$tool_root" \
          cargo-audit@0.22.1 \
          cargo-deny@0.19.5 \
          cargo-machete@0.9.2 \
          taplo-cli@0.10.0 \
          typos-cli@1.44.0 \
          zizmor@1.25.2
        for binary in cargo-audit cargo-deny cargo-machete taplo typos zizmor; do
          sudo install -m 0755 "$tool_root/bin/$binary" "/usr/local/bin/$binary"
        done

    - name: Install pinned standalone quality tools
      shell: bash
      run: |
        set -euo pipefail
        tool_root="$RUNNER_TEMP/tovuk-quality-tools"
        bin_dir="$tool_root/bin"
        archive_dir="$tool_root/archives"
        mkdir -p "$bin_dir" "$archive_dir"

        actionlint_archive="$archive_dir/actionlint.tar.gz"
        curl --proto '=https' --tlsv1.2 --fail --show-error --location \
          --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          --output "$actionlint_archive"
        printf '%s  %s\n' \
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
          "$actionlint_archive" | sha256sum --check --strict
        tar -xzf "$actionlint_archive" -C "$bin_dir" actionlint

        shellcheck_archive="$archive_dir/shellcheck.tar.gz"
        curl --proto '=https' --tlsv1.2 --fail --show-error --location \
          --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
          https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
          --output "$shellcheck_archive"
        printf '%s  %s\n' \
          b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 \
          "$shellcheck_archive" | sha256sum --check --strict
        tar -xzf "$shellcheck_archive" --strip-components=1 -C "$bin_dir" \
          shellcheck-v0.11.0/shellcheck

        shfmt_binary="$bin_dir/shfmt"
        curl --proto '=https' --tlsv1.2 --fail --show-error --location \
          --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
          https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64 \
          --output "$shfmt_binary"
        printf '%s  %s\n' \
          fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1 \
          "$shfmt_binary" | sha256sum --check --strict
        chmod 0755 "$bin_dir/actionlint" "$bin_dir/shellcheck" "$shfmt_binary"
        for binary in actionlint shellcheck shfmt; do
          sudo install -m 0755 "$bin_dir/$binary" "/usr/local/bin/$binary"
        done

    - name: Verify pinned quality tool versions
      shell: bash
      run: |
        set -euo pipefail
        actionlint -version
        cargo audit --version
        cargo deny --version
        cargo machete --version
        shellcheck --version
        shfmt --version
        taplo --version
        typos --version
        zizmor --version
