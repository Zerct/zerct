name: Ref history audit

# The repository-scoped organization ruleset pins this workflow and checker source.
# Ordinary pull-request and push runs remain read-only defense in depth.

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  history:
    name: Git object history audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pinned workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Check out exact event history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: .tovuk-event
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Build event history checker
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tovuk-trusted-history
        run: cargo build --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts
      - name: Check newly reachable Git objects
        env:
          TOVUK_CI_EVENT_NAME: ${{ github.event_name }}
          TOVUK_CI_EVENT_REF: ${{ github.ref }}
          TOVUK_CI_EVENT_REF_TYPE: ${{ github.ref_type }}
          TOVUK_CI_EVENT_SHA: ${{ github.sha }}
          TOVUK_CI_PULL_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          TOVUK_CI_PULL_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          TOVUK_CI_PULL_MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
          TOVUK_CI_PULL_NUMBER: ${{ github.event_name == 'pull_request' && format('{0}', github.event.pull_request.number) || '' }}
          TOVUK_CI_PUSH_AFTER_SHA: ${{ github.event_name == 'push' && github.event.after || '' }}
          TOVUK_CI_PUSH_BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          TOVUK_CI_PUSH_CREATED: ${{ github.event_name == 'push' && format('{0}', github.event.created) || '' }}
          TOVUK_CI_PUSH_DELETED: ${{ github.event_name == 'push' && format('{0}', github.event.deleted) || '' }}
          TOVUK_CI_PUSH_FORCED: ${{ github.event_name == 'push' && format('{0}', github.event.forced) || '' }}
          TOVUK_CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        working-directory: .tovuk-event
        run: '"$RUNNER_TEMP/tovuk-trusted-history/debug/check-public-contracts" ci-snapshot'
