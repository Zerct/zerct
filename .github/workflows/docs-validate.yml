name: Validate Mintlify docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "checks/**"
      - ".github/workflows/docs-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- docs
      - run: |
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style -- --self-test
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style --
      - name: Validate Mintlify build
        run: npx --yes mint@4.2.578 validate
        working-directory: docs
        env:
          MINTLIFY_TELEMETRY_DISABLED: "1"
      - name: Check Mintlify links
        run: npx --yes mint@4.2.578 broken-links --check-anchors --check-redirects --check-snippets
        working-directory: docs
        env:
          MINTLIFY_TELEMETRY_DISABLED: "1"
      - name: Check Mintlify accessibility
        run: npx --yes mint@4.2.578 a11y
        working-directory: docs
        env:
          MINTLIFY_TELEMETRY_DISABLED: "1"
