name: Validate Mintlify docs

on:
  pull_request:
    paths:
      - "docs/**"
      - ".vacuum.yaml"
      - "scripts/check-docs.mjs"
      - "scripts/check-openapi.sh"
      - "scripts/check-prose-style.mjs"
      - ".github/workflows/docs-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate docs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"
          cache: false
      - run: node scripts/check-docs.mjs
      - run: node scripts/check-prose-style.mjs
      - run: scripts/check-openapi.sh
      - name: Validate Mintlify build
        run: npx --yes mint@latest validate
        working-directory: docs
        env:
          MINTLIFY_TELEMETRY_DISABLED: "1"
      - name: Check Mintlify links
        run: npx --yes mint@latest broken-links --check-anchors --check-redirects --check-snippets
        working-directory: docs
        env:
          MINTLIFY_TELEMETRY_DISABLED: "1"
      - name: Check Mintlify accessibility
        run: npx --yes mint@latest a11y --skip-contrast
        working-directory: docs
        env:
          MINTLIFY_TELEMETRY_DISABLED: "1"
