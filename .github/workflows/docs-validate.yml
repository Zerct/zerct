name: Validate Mintlify docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "checks/**"
      - "scripts/check-public-contracts.sh"
      - "scripts/check-prose-style.sh"
      - ".github/workflows/docs-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mintlify-4.2.578
          restore-keys: |
            ${{ runner.os }}-npm-mintlify-
      - run: ./scripts/check-public-contracts.sh docs
      - run: |
          ./scripts/check-prose-style.sh --self-test
          ./scripts/check-prose-style.sh
      - name: Validate Mintlify build
        run: npx --yes mint@4.2.578 validate
        working-directory: docs
        env:
          MINTLIFY_TELEMETRY_DISABLED: "1"
      - name: Check Mintlify links
        run: npx --yes mint@4.2.578 broken-links --check-anchors --check-redirects --check-snippets
        working-directory: docs
        env:
          MINTLIFY_TELEMETRY_DISABLED: "1"
      - name: Check Mintlify accessibility
        run: npx --yes mint@4.2.578 a11y --skip-contrast
        working-directory: docs
        env:
          MINTLIFY_TELEMETRY_DISABLED: "1"
