name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/**"
      - ".cargo/**"
      - ".editorconfig"
      - ".githooks/**"
      - ".gitattributes"
      - ".gitignore"
      - ".oxlintrc.json"
      - ".prettierrc.json"
      - ".typos.toml"
      - ".vacuum.yaml"
      - "AGENTS.md"
      - "checks/**"
      - "clippy.toml"
      - "dependency-feature-policy.json"
      - "Formula/**"
      - "README.md"
      - "crates/tovuk/**"
      - "deny.toml"
      - "deny*.toml"
      - "docs/**"
      - "native-release-targets.json"
      - "packages/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "skills/**"
      - "vendor/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".cargo/**"
      - ".editorconfig"
      - ".githooks/**"
      - ".gitattributes"
      - ".gitignore"
      - ".oxlintrc.json"
      - ".prettierrc.json"
      - ".typos.toml"
      - ".vacuum.yaml"
      - "AGENTS.md"
      - "checks/**"
      - "clippy.toml"
      - "dependency-feature-policy.json"
      - "Formula/**"
      - "README.md"
      - "crates/tovuk/**"
      - "deny.toml"
      - "deny*.toml"
      - "docs/**"
      - "native-release-targets.json"
      - "packages/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "skills/**"
      - "vendor/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-check:
    name: full public repo check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          version: "0.11.28"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - uses: ./.github/actions/setup-quality-tools
      - name: Check GitHub Actions policy
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-github-actions --
      - name: Lint GitHub Actions
        run: actionlint -config-file .github/actionlint.yaml -color
      - name: Run full repository check
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-all --
