name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-check:
    name: full public repo check
    runs-on: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'tovuk-public-linux-x64' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.11.28"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - uses: ./.github/actions/setup-quality-tools
        if: runner.environment == 'github-hosted'
      - name: Check GitHub Actions policy
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-github-actions --
      - name: Lint GitHub Actions
        run: actionlint -config-file .github/actionlint.yaml -color
      - name: Run full repository check
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-all --
