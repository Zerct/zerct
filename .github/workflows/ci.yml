name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/**"
      - ".gitignore"
      - ".typos.toml"
      - ".vacuum.yaml"
      - "AGENTS.md"
      - "Formula/**"
      - "README.md"
      - "crates/tovuk/**"
      - "deny.toml"
      - "docs/**"
      - "native-release-targets.json"
      - "packages/**"
      - "scripts/**"
      - "skills/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".gitignore"
      - ".typos.toml"
      - ".vacuum.yaml"
      - "AGENTS.md"
      - "Formula/**"
      - "README.md"
      - "crates/tovuk/**"
      - "deny.toml"
      - "docs/**"
      - "native-release-targets.json"
      - "packages/**"
      - "scripts/**"
      - "skills/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-check:
    name: full public repo check
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.actor == 'kriptoburak' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main'
      ) || (
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'kriptoburak' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: [self-hosted, tovuk, linux, x64, public-trusted-ci]
    timeout-minutes: 40
    steps:
      - name: Checkout trusted commit without third-party actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --initial-branch=main .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Check GitHub Actions policy
        run: scripts/check-github-actions.sh
      - name: Lint GitHub Actions
        run: actionlint -color
      - name: Run full repository check
        run: scripts/check-all.sh
