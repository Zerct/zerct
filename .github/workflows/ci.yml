name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/**"
      - "Formula/**"
      - "README.md"
      - "crates/tovuk/**"
      - "docs/**"
      - "examples/**"
      - "packages/**"
      - "scripts/**"
      - "skills/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "Formula/**"
      - "README.md"
      - "crates/tovuk/**"
      - "docs/**"
      - "examples/**"
      - "packages/**"
      - "scripts/**"
      - "skills/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-policy:
    name: workflow policy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Check GitHub Actions policy
        run: scripts/check-github-actions.sh
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest -color

  full-check:
    name: full public repo check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/tovuk/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/tovuk-py/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            crates/tovuk/target
            examples/hello-rust/target
          key: ${{ runner.os }}-cargo-public-${{ hashFiles('crates/tovuk/Cargo.lock', 'examples/hello-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-public-
      - name: Run full repository check
        run: scripts/check-all.sh
