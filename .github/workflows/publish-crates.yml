name: Publish crates.io package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crates/zerct/Cargo.toml"

permissions:
  contents: read

jobs:
  publish:
    name: publish zerct to crates.io
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: crates
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check registry version
        id: version
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' crates/zerct/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          status="$(curl -sS -o /tmp/zerct-crate.json -w "%{http_code}" "https://crates.io/api/v1/crates/zerct/$version")"
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::zerct@$version already exists on crates.io; skipping publish."
          elif [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected crates.io status: $status" >&2
            cat /tmp/zerct-crate.json >&2
            exit 1
          fi
      - if: steps.version.outputs.exists == 'false'
        run: node scripts/check-prose-style.mjs
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.exists == 'false'
      - if: steps.version.outputs.exists == 'false'
        run: cargo package --locked
        working-directory: crates/zerct
      - if: steps.version.outputs.exists == 'false'
        run: cargo publish --locked
        working-directory: crates/zerct
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
