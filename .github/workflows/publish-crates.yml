name: Publish crates.io package

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare crates.io package
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      version: ${{ steps.version.outputs.version }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            crates/tovuk/target
          key: crates-prepare-${{ runner.os }}-${{ hashFiles('crates/tovuk/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Add Cargo tools to PATH
        shell: bash
        run: echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Check public release version contract
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- package-versions
      - name: Check registry version
        id: version
        run: |
          version="$(cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- public-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/tovuk-crate.json" -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "User-Agent: Tovuk publish workflow (https://github.com/tovuk/tovuk)" \
            "https://crates.io/api/v1/crates/tovuk/$version")"
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tovuk@$version already exists on crates.io; skipping publish."
          elif [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected crates.io status: $status" >&2
            cat "$RUNNER_TEMP/tovuk-crate.json" >&2
            exit 1
          fi
      - if: steps.version.outputs.exists == 'false'
        run: |
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style -- --self-test
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style --
      - if: steps.version.outputs.exists == 'false'
        run: cargo package --locked
        working-directory: crates/tovuk

  publish:
    name: publish tovuk to crates.io
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: crates
    permissions:
      contents: read
      id-token: write # Required for crates.io Trusted Publishing.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify pinned Rust toolchain
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Authenticate with crates.io trusted publishing
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the package without re-executing package code
        run: cargo publish --locked --no-verify
        working-directory: crates/tovuk
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home

  verify:
    name: verify crates.io package
    needs:
      - prepare
      - publish
    if: ${{ always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify crates.io package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for delay in 0 10 10 15 15 20 20 30 30 30; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            if ! status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/tovuk-crate.json" -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "User-Agent: Tovuk publish workflow (https://github.com/tovuk/tovuk)" \
              "https://crates.io/api/v1/crates/tovuk/$VERSION")"; then
              continue
            fi
            if [ "$status" = "200" ]; then
              exit 0
            fi
          done
          if [ -f "$RUNNER_TEMP/tovuk-crate.json" ]; then
            cat "$RUNNER_TEMP/tovuk-crate.json" >&2
          fi
          echo "tovuk@$VERSION was not visible on crates.io after publish" >&2
          exit 1
