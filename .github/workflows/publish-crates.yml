name: Publish crates.io package
run-name: Publish crates.io ${{ inputs.release_ref }} via ${{ inputs.orchestration_id }}

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact existing release tag, such as v0.1.117
        required: true
        type: string
      release_commit:
        description: Exact 40-hex commit resolved from the release tag
        required: true
        type: string
      orchestration_id:
        description: Unique numeric recovery run and attempt identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare crates.io package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      version: ${{ steps.release.outputs.version }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            crates/tovuk/target
          key: crates-prepare-${{ runner.os }}-${{ hashFiles('crates/tovuk/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Add Cargo tools to PATH
        shell: bash
        run: echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Resolve exact native release source
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RELEASE_REF: ${{ inputs.release_ref }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
        run: |
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- package-versions
          version="$(cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-public-contracts -- public-version)"
          release_ref="$INPUT_RELEASE_REF"
          if [ "$release_ref" != "v$version" ]; then
            echo "Release ref $release_ref does not match public version v$version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$release_ref" ] || \
            [ "$GITHUB_SHA" != "$INPUT_RELEASE_COMMIT" ]; then
            echo "Workflow ref or commit does not match the requested release" >&2
            exit 1
          fi
          if [[ ! "$INPUT_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || \
            [[ ! "$ORCHESTRATION_ID" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "Release commit or orchestration identifier is invalid" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$release_ref:refs/tags/$release_ref"
          release_commit="$(git rev-parse "refs/tags/$release_ref^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [ "$release_commit" != "$INPUT_RELEASE_COMMIT" ] || \
            [ "$checkout_commit" != "$release_commit" ]; then
            echo "Release tag $release_ref did not resolve to the checked-out commit" >&2
            exit 1
          fi
          release_target="$(gh api --jq '.target_commitish' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$release_ref")"
          if [ "$release_target" != "$release_commit" ]; then
            echo "Release target $release_target does not match tag commit $release_commit" >&2
            exit 1
          fi
          cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-native-release-assets -- "$version"
          printf 'release_commit=%s\nversion=%s\n' "$release_commit" "$version" >> "$GITHUB_OUTPUT"
      - name: Check registry version
        id: version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          status=""
          for delay in 0 5 10 20 30 60; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            if ! candidate_status="$(curl -sS --connect-timeout 10 --max-time 30 \
              -o "$RUNNER_TEMP/tovuk-crate.json" -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "User-Agent: Tovuk publish workflow (https://github.com/tovuk/tovuk)" \
              "https://crates.io/api/v1/crates/tovuk/$VERSION")"; then
              continue
            fi
            status="$candidate_status"
            case "$status" in
              200|404)
                break
                ;;
              429|5??)
                continue
                ;;
              *)
                break
                ;;
            esac
          done
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tovuk@$VERSION already exists on crates.io; skipping publish."
          elif [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected crates.io status: $status" >&2
            cat "$RUNNER_TEMP/tovuk-crate.json" >&2
            exit 1
          fi
      - if: steps.version.outputs.exists == 'false'
        run: |
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style -- --self-test
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style --
      - if: steps.version.outputs.exists == 'false'
        run: cargo package --locked
        working-directory: crates/tovuk

  publish:
    name: publish tovuk to crates.io
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: crates
    permissions:
      contents: read
      id-token: write # Required for crates.io Trusted Publishing.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify pinned Rust toolchain
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Authenticate with crates.io trusted publishing
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the package without re-executing package code
        run: cargo publish --locked --no-verify
        working-directory: crates/tovuk
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home

  verify:
    name: verify crates.io package
    needs:
      - prepare
      - publish
    if: ${{ always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify crates.io package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for delay in 0 10 10 15 15 20 20 30 30 30; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            if ! status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/tovuk-crate.json" -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "User-Agent: Tovuk publish workflow (https://github.com/tovuk/tovuk)" \
              "https://crates.io/api/v1/crates/tovuk/$VERSION")"; then
              continue
            fi
            if [ "$status" = "200" ]; then
              exit 0
            fi
          done
          if [ -f "$RUNNER_TEMP/tovuk-crate.json" ]; then
            cat "$RUNNER_TEMP/tovuk-crate.json" >&2
          fi
          echo "tovuk@$VERSION was not visible on crates.io after publish" >&2
          exit 1
