name: Publish crates.io package

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish native binaries
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish tovuk to crates.io
    if: ${{ github.actor == 'kriptoburak' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: [self-hosted, tovuk, linux, x64, public-trusted-ci]
    timeout-minutes: 20
    environment: crates
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Cargo tools to PATH
        shell: bash
        run: echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Check public release version contract
        run: scripts/check-public-contracts.sh package-versions
      - name: Check registry version
        id: version
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' crates/tovuk/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          status="$(curl -sS -o /tmp/tovuk-crate.json -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "User-Agent: Tovuk publish workflow (https://github.com/tovuk/tovuk)" \
            "https://crates.io/api/v1/crates/tovuk/$version")"
          if [ "$status" = "200" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::tovuk@$version already exists on crates.io. Bump every public package version before pushing CLI changes."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tovuk@$version already exists on crates.io; skipping publish."
          elif [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected crates.io status: $status" >&2
            cat /tmp/tovuk-crate.json >&2
            exit 1
          fi
      - if: steps.version.outputs.exists == 'false'
        run: |
          ./scripts/check-prose-style.sh --self-test
          ./scripts/check-prose-style.sh
      - uses: actions/cache@v6
        if: steps.version.outputs.exists == 'false'
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            crates/tovuk/target
          key: ${{ runner.os }}-cargo-tovuk-crates-${{ hashFiles('crates/tovuk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tovuk-crates-
      - if: steps.version.outputs.exists == 'false'
        run: cargo package --locked
        working-directory: crates/tovuk
      - name: Authenticate with crates.io trusted publishing
        id: crates_io_auth
        if: steps.version.outputs.exists == 'false'
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.version.outputs.exists == 'false'
        run: cargo publish --locked
        working-directory: crates/tovuk
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
      - name: Verify crates.io package
        if: steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          for delay in 0 10 10 10 10 10; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            status="$(curl -sS -o /tmp/tovuk-crate.json -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "User-Agent: Tovuk publish workflow (https://github.com/tovuk/tovuk)" \
              "https://crates.io/api/v1/crates/tovuk/$version")"
            if [ "$status" = "200" ]; then
              exit 0
            fi
          done
          cat /tmp/tovuk-crate.json >&2 || true
          echo "tovuk@$version was not visible on crates.io after publish" >&2
          exit 1
