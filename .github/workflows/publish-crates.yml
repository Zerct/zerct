name: Publish crates.io package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish zerct to crates.io
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: crates
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node scripts/check-prose-style.mjs
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package
        working-directory: crates/zerct
      - run: cargo publish
        working-directory: crates/zerct
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
