name: Publish PyPI package
run-name: Publish PyPI ${{ inputs.release_ref }} via ${{ inputs.orchestration_id }}

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact existing release tag, such as v0.1.118
        required: true
        type: string
      release_commit:
        description: Exact 40-hex commit resolved from the release tag
        required: true
        type: string
      orchestration_id:
        description: Unique numeric recovery run and attempt identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare PyPI package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            checks/target
            crates/tovuk/target
          key: pypi-prepare-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          version: "0.11.28"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Sync generated native target manifests
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin sync-native-release-targets -- --check
      - name: Resolve exact native release source
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RELEASE_REF: ${{ inputs.release_ref }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
        run: |
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- package-versions
          version="$(cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-public-contracts -- public-version)"
          release_ref="$INPUT_RELEASE_REF"
          if [ "$release_ref" != "v$version" ]; then
            echo "Release ref $release_ref does not match public version v$version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$release_ref" ] || \
            [ "$GITHUB_SHA" != "$INPUT_RELEASE_COMMIT" ]; then
            echo "Workflow ref or commit does not match the requested release" >&2
            exit 1
          fi
          if [[ ! "$INPUT_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || \
            [[ ! "$ORCHESTRATION_ID" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "Release commit or orchestration identifier is invalid" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$release_ref:refs/tags/$release_ref"
          release_commit="$(git rev-parse "refs/tags/$release_ref^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [ "$release_commit" != "$INPUT_RELEASE_COMMIT" ] || \
            [ "$checkout_commit" != "$release_commit" ]; then
            echo "Release tag $release_ref did not resolve to the checked-out commit" >&2
            exit 1
          fi
          release_target="$(gh api --jq '.target_commitish' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$release_ref")"
          if [ "$release_target" != "$release_commit" ]; then
            echo "Release target $release_target does not match tag commit $release_commit" >&2
            exit 1
          fi
          cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-native-release-assets -- "$version"
          printf 'release_commit=%s\nversion=%s\n' "$release_commit" "$version" >> "$GITHUB_OUTPUT"
      - name: Check registry version
        id: version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          status=""
          for delay in 0 5 10 20 30 60; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            if ! candidate_status="$(curl -sS --connect-timeout 10 --max-time 30 \
              -o "$RUNNER_TEMP/tovuk-pypi.json" -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'User-Agent: Tovuk publish workflow (https://github.com/tovuk/tovuk)' \
              "https://pypi.org/pypi/tovuk/$VERSION/json")"; then
              continue
            fi
            status="$candidate_status"
            case "$status" in
              200|404)
                break
                ;;
              429|5??)
                continue
                ;;
              *)
                break
                ;;
            esac
          done
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tovuk $VERSION already exists on PyPI; skipping publish."
          elif [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected PyPI status: $status" >&2
            cat "$RUNNER_TEMP/tovuk-pypi.json" >&2
            exit 1
          fi
      - if: steps.version.outputs.exists == 'false'
        run: |
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style -- --self-test
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style --
      - if: steps.version.outputs.exists == 'false'
        run: cargo build --locked --release --manifest-path crates/tovuk/Cargo.toml
      - if: steps.version.outputs.exists == 'false'
        run: |
          uvx --from ruff==0.15.21 ruff format --check packages/tovuk-py
          uvx --from ruff==0.15.21 ruff check packages/tovuk-py
          uvx --from ty==0.0.58 ty check \
            --project packages/tovuk-py \
            --extra-search-path packages/tovuk-py/src \
            --error-on-warning \
            packages/tovuk-py/src packages/tovuk-py/tests
          PYTHONPATH=packages/tovuk-py/src \
            python3 -m unittest discover -s packages/tovuk-py/tests
          python3 -m compileall -q packages/tovuk-py/src
          PYTHONPATH=packages/tovuk-py/src python3 -m tovuk --help >/tmp/tovuk-help.txt
          grep -q 'tovuk support create' /tmp/tovuk-help.txt
        env:
          TOVUK_NATIVE_BINARY: ${{ github.workspace }}/crates/tovuk/target/release/tovuk
      - name: Verify native release assets
        if: steps.version.outputs.exists == 'false'
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-native-release-assets -- "$VERSION"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.version.outputs.exists == 'false'
        with:
          python-version: "3.14.6"
      - if: steps.version.outputs.exists == 'false'
        run: |
          uvx --no-config --default-index https://pypi.org/simple \
            --python 3.14.6 --no-python-downloads --from build==1.5.1 \
            pyproject-build --installer uv --outdir "$RUNNER_TEMP/pypi-dist" .
        working-directory: packages/tovuk-py
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.exists == 'false'
        with:
          name: tovuk-pypi-dist
          path: ${{ runner.temp }}/pypi-dist
          if-no-files-found: error

  publish:
    name: publish tovuk to PyPI
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write # Required for PyPI trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tovuk-pypi-dist
          path: pypi-dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: pypi-dist

  verify:
    name: verify PyPI package
    needs:
      - prepare
      - publish
    if: ${{ always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify PyPI package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for delay in 0 10 10 15 15 20 20 30 30 30; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            if status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/tovuk-pypi.json" -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'User-Agent: Tovuk publish workflow (https://github.com/tovuk/tovuk)' \
              "https://pypi.org/pypi/tovuk/$VERSION/json")" && [ "$status" = "200" ]; then
              exit 0
            fi
          done
          if [ -f "$RUNNER_TEMP/tovuk-pypi.json" ]; then
            cat "$RUNNER_TEMP/tovuk-pypi.json" >&2
          fi
          echo "tovuk $VERSION was not visible on PyPI after publish" >&2
          exit 1
