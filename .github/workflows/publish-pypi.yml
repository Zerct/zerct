name: Publish PyPI package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/tovuk-py/pyproject.toml"
      - "packages/tovuk-py/src/tovuk/__init__.py"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish tovuk to PyPI
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: pypi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check registry version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          import urllib.error
          import urllib.request

          version = tomllib.load(open("packages/tovuk-py/pyproject.toml", "rb"))["project"]["version"]
          print(f"version={version}")
          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/tovuk/{version}/json", timeout=10).close()
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("exists=false")
              else:
                  raise
          else:
              print("exists=true")
          PY
      - if: steps.version.outputs.exists == 'false'
        run: node scripts/check-prose-style.mjs
      - uses: actions/setup-python@v6
        if: steps.version.outputs.exists == 'false'
        with:
          python-version: "3.13"
      - if: steps.version.outputs.exists == 'false'
        run: python -m pip install --upgrade build==1.5.0
      - if: steps.version.outputs.exists == 'false'
        run: python -m build
        working-directory: packages/tovuk-py
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.version.outputs.exists == 'false'
        with:
          packages-dir: packages/tovuk-py/dist
