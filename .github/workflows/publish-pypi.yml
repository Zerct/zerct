name: Publish PyPI package

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish native binaries
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare PyPI package
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync generated native target manifests
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin sync-native-release-targets --
      - name: Check public release version contract
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- package-versions
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            crates/tovuk/target
          key: ${{ runner.os }}-cargo-tovuk-pypi-${{ hashFiles('crates/tovuk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tovuk-pypi-
      - name: Verify unscoped PyPI project name
        run: |
          python3 - <<'PY'
          import tomllib

          name = tomllib.load(open("packages/tovuk-py/pyproject.toml", "rb"))["project"]["name"]
          if name != "tovuk":
              raise SystemExit(f'PyPI project name must stay unscoped "tovuk", got {name!r}')
          PY
      - name: Check registry version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          import os
          import urllib.error
          import urllib.request

          version = tomllib.load(open("packages/tovuk-py/pyproject.toml", "rb"))["project"]["version"]
          print(f"version={version}")
          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/tovuk/{version}/json", timeout=10).close()
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("exists=false")
              else:
                  raise
          else:
              if os.environ.get("GITHUB_EVENT_NAME") == "push":
                  raise SystemExit(f"tovuk {version} already exists on PyPI. Bump every public package version before pushing CLI changes.")
              print("exists=true")
          PY
      - if: steps.version.outputs.exists == 'false'
        run: |
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style -- --self-test
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style --
      - if: steps.version.outputs.exists == 'false'
        run: cargo build --locked --release --manifest-path crates/tovuk/Cargo.toml
      - if: steps.version.outputs.exists == 'false'
        run: |
          python3 -m compileall -q packages/tovuk-py/src
          PYTHONPATH=packages/tovuk-py/src python3 -m tovuk --help >/tmp/tovuk-help.txt
          grep -q 'tovuk support create' /tmp/tovuk-help.txt
        env:
          TOVUK_NATIVE_BINARY: ${{ github.workspace }}/crates/tovuk/target/release/tovuk
      - name: Verify native release assets
        if: steps.version.outputs.exists == 'false'
        run: ./scripts/check-native-release-assets.sh "${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v6
        if: steps.version.outputs.exists == 'false'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/tovuk-py/pyproject.toml
      - if: steps.version.outputs.exists == 'false'
        run: python -m pip install --upgrade build==1.4.4
      - if: steps.version.outputs.exists == 'false'
        run: |
          rm -rf dist
          python -m build
        working-directory: packages/tovuk-py
      - uses: actions/upload-artifact@v6
        if: steps.version.outputs.exists == 'false'
        with:
          name: tovuk-pypi-dist
          path: packages/tovuk-py/dist
          if-no-files-found: error

  publish:
    name: publish tovuk to PyPI
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Select PyPI publish auth
        id: publish_auth
        run: |
          if [ -n "${PYPI_API_TOKEN:-}" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${PYPI_TRUSTED_PUBLISHING_ENABLED:-}" = "true" ]; then
            echo "method=trusted" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::PyPI publish auth is not configured. Set PYPI_API_TOKEN or enable trusted publishing for project tovuk with owner tovuk, repository tovuk, workflow publish-pypi.yml, environment pypi."
          exit 1
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_TRUSTED_PUBLISHING_ENABLED: ${{ vars.PYPI_TRUSTED_PUBLISHING_ENABLED }}
      - uses: actions/download-artifact@v6
        with:
          name: tovuk-pypi-dist
          path: pypi-dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.publish_auth.outputs.method == 'trusted'
        with:
          packages-dir: pypi-dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.publish_auth.outputs.method == 'token'
        with:
          packages-dir: pypi-dist
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Verify PyPI package
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          version = "${{ needs.prepare.outputs.version }}"
          for delay in [0, 10, 10, 15, 15, 20, 20, 30, 30, 30]:
              if delay:
                  time.sleep(delay)
              try:
                  urllib.request.urlopen(f"https://pypi.org/pypi/tovuk/{version}/json", timeout=10).close()
                  raise SystemExit(0)
              except Exception:
                  pass
          raise SystemExit(f"tovuk {version} was not visible on PyPI after publish")
          PY
