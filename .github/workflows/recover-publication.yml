name: Recover public package publication
run-name: Recover public packages ${{ inputs.release_ref }} via ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact existing release tag, such as v0.1.117
        required: true
        type: string
      request_id:
        default: manual
        description: Unique caller identifier used to locate this recovery run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: recovery-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: verify existing native release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.release.outputs.release_commit }}
      release_ref: ${{ steps.release.outputs.release_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            checks/target
          key: publication-recovery-${{ runner.os }}-${{ hashFiles('checks/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Verify exact existing native release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          version="$(cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-public-contracts -- public-version)"
          if [ "$RELEASE_REF" != "v$version" ]; then
            echo "Release ref $RELEASE_REF does not match public version v$version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_REF" ]; then
            echo "Recovery must execute from the requested release tag" >&2
            exit 1
          fi
          if [[ ! "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "Recovery request identifier is invalid" >&2
            exit 1
          fi
          release_commit="$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]] || \
            [ "$checkout_commit" != "$release_commit" ] || \
            [ "$GITHUB_SHA" != "$release_commit" ]; then
            echo "Release tag $RELEASE_REF did not resolve to the checked-out commit" >&2
            exit 1
          fi
          release_target="$(gh api --jq '.target_commitish' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_REF")"
          if [ "$release_target" != "$release_commit" ]; then
            echo "Release target $release_target does not match tag commit $release_commit" >&2
            exit 1
          fi
          cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-public-contracts -- package-versions
          cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-native-release-assets -- "$version"
          printf 'release_commit=%s\nrelease_ref=%s\n' \
            "$release_commit" "$RELEASE_REF" >> "$GITHUB_OUTPUT"

  dispatch:
    name: dispatch and verify registry publishers
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write # Dispatch and monitor the dedicated trusted-publisher workflows.
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.gate.outputs.release_commit }}
      RELEASE_REF: ${{ needs.gate.outputs.release_ref }}
    steps:
      - name: Install pinned GitHub CLI
        shell: bash
        run: |
          gh_version="2.96.0"
          gh_root="$RUNNER_TEMP/gh-$gh_version"
          mkdir -p "$gh_root"
          gh_sha256="83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "https://github.com/cli/cli/releases/download/v$gh_version/gh_${gh_version}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/gh.tar.gz"
          printf '%s  %s\n' "$gh_sha256" "$RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" --strip-components=1 -C "$gh_root"
          echo "$gh_root/bin" >> "$GITHUB_PATH"
          "$gh_root/bin/gh" --version
      - name: Dispatch and wait for trusted publishers
        shell: bash
        run: |
          orchestration_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          workflows=(publish-crates.yml publish-npm.yml publish-pypi.yml)
          labels=("Publish crates.io" "Publish npm" "Publish PyPI")
          run_ids=()

          dispatch_publisher() {
            local workflow="$1"
            for delay in 0 2 4 8 15; do
              if [ "$delay" != 0 ]; then
                sleep "$delay"
              fi
              if gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_REF" \
                -f "release_ref=$RELEASE_REF" \
                -f "release_commit=$RELEASE_COMMIT" \
                -f "orchestration_id=$orchestration_id"; then
                return 0
              fi
            done
            return 1
          }

          for workflow in "${workflows[@]}"; do
            if ! dispatch_publisher "$workflow"; then
              echo "Dispatch response remained unsuccessful for $workflow; checking for an accepted run." >&2
            fi
          done

          for index in "${!workflows[@]}"; do
            workflow="${workflows[$index]}"
            title="${labels[$index]} $RELEASE_REF via $orchestration_id"
            matched_run_ids=()
            for delay in 1 2 4 8 15 30; do
              sleep "$delay"
              if ! candidate_run_ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --event workflow_dispatch --commit "$RELEASE_COMMIT" --limit 20 \
                --json databaseId,displayTitle \
                --jq ".[] | select(.displayTitle == \"$title\") | .databaseId")"; then
                continue
              fi
              matched_run_ids=()
              while IFS= read -r candidate_run_id; do
                if [ -z "$candidate_run_id" ]; then
                  continue
                fi
                if [[ ! "$candidate_run_id" =~ ^[0-9]+$ ]]; then
                  echo "Invalid workflow run identifier: $candidate_run_id" >&2
                  exit 1
                fi
                matched_run_ids+=("$candidate_run_id")
              done <<< "$candidate_run_ids"
              if [ "${#matched_run_ids[@]}" -gt 0 ]; then
                break
              fi
            done
            if [ "${#matched_run_ids[@]}" -eq 0 ]; then
              echo "Unable to locate dispatched workflow $workflow" >&2
              exit 1
            fi
            run_ids+=("${matched_run_ids[@]}")
          done

          publisher_failed=false
          for run_id in "${run_ids[@]}"; do
            if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" \
              --exit-status --interval 10; then
              publisher_failed=true
            fi
          done
          if [ "$publisher_failed" = "true" ]; then
            echo "At least one trusted publisher failed" >&2
            exit 1
          fi
