name: Score Mintlify docs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  deployments: read # Verify the exact Mintlify deployment for the docs revision.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  score:
    name: score docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Check prose style
        run: |
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style -- --self-test
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-prose-style --
      - name: Check public agent readiness
        run: |
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- mintlify-agent-readiness https://docs.tovuk.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOVUK_DOCS_CHECK_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TOVUK_DOCS_REVISION: ${{ github.sha }}
      - name: Run authenticated Mintlify score when configured
        run: |
          if [ -z "${MINTLIFY_CLI_CONFIG_JSON:-}" ]; then
            echo "MINTLIFY_CLI_CONFIG_JSON is not configured; public readiness checks already passed."
            exit 0
          fi

          umask 077
          mkdir -p "$HOME/.config/mintlify"
          mintlify_config="$HOME/.config/mintlify/config.json"
          trap 'rm -f "$mintlify_config"' EXIT
          printf '%s' "$MINTLIFY_CLI_CONFIG_JSON" > "$mintlify_config"
          npx --yes mint@4.2.578 score https://docs.tovuk.com --format json > mint-score.json
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- mintlify-score mint-score.json
        env:
          MINTLIFY_CLI_CONFIG_JSON: ${{ secrets.MINTLIFY_CLI_CONFIG_JSON }}
          MINTLIFY_SCORE_MIN: ${{ vars.MINTLIFY_SCORE_MIN }}
          MINTLIFY_TELEMETRY_DISABLED: "1"
