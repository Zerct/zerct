name: Score Mintlify docs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  score:
    name: score docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-mintlify-4.2.578
          restore-keys: |
            ${{ runner.os }}-npm-mintlify-
      - name: Check prose style
        run: node scripts/check-prose-style.mjs
      - name: Check public agent readiness
        run: |
          if node scripts/check-mintlify-agent-readiness.mjs https://docs.tovuk.com; then
            exit 0
          fi

          if [ "${TOVUK_DOCS_PUBLIC_REQUIRED:-}" = "true" ]; then
            exit 1
          fi

          echo "::warning::docs.tovuk.com is not publicly reachable for agent-readiness checks yet. Set TOVUK_DOCS_PUBLIC_REQUIRED=true after the docs host is live."
        env:
          TOVUK_DOCS_PUBLIC_REQUIRED: ${{ vars.TOVUK_DOCS_PUBLIC_REQUIRED }}
      - name: Run authenticated Mintlify score when configured
        run: |
          if [ -z "${MINTLIFY_CLI_CONFIG_JSON:-}" ]; then
            echo "MINTLIFY_CLI_CONFIG_JSON is not configured; public readiness checks already passed."
            exit 0
          fi

          mkdir -p "$HOME/.config/mintlify"
          printf '%s' "$MINTLIFY_CLI_CONFIG_JSON" > "$HOME/.config/mintlify/config.json"
          npx --yes mint@4.2.578 score https://docs.tovuk.com --format json > mint-score.json
          node <<'NODE'
            const fs = require("node:fs");
            const score = JSON.parse(fs.readFileSync("mint-score.json", "utf8"));
            const value = Number(score.score ?? score.overallScore ?? 0);
            const configuredMinimum = process.env.MINTLIFY_SCORE_MIN?.trim();
            const minimum = Number(configuredMinimum || "90");
            if (value < minimum) {
              console.error(`Mintlify score is ${value}/100; expected at least ${minimum}/100`);
              process.exit(1);
            }
            console.log(`Mintlify score is ${value}/100`);
          NODE
        env:
          MINTLIFY_CLI_CONFIG_JSON: ${{ secrets.MINTLIFY_CLI_CONFIG_JSON }}
          MINTLIFY_SCORE_MIN: ${{ vars.MINTLIFY_SCORE_MIN }}
          MINTLIFY_TELEMETRY_DISABLED: "1"
