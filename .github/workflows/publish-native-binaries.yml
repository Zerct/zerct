name: Publish native binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "native-release-targets.json"
      - "crates/tovuk/Cargo.toml"
      - "crates/tovuk/Cargo.lock"
      - "crates/tovuk/src/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: release gate
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'kriptoburak' }}
    runs-on: [self-hosted, tovuk, linux, x64, public-trusted-ci]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted commit without third-party actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --initial-branch=main .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Check public agent readiness
        continue-on-error: true
        run: ./scripts/check-public-contracts.sh mintlify-agent-readiness https://docs.tovuk.com
      - name: Run full repository check
        run: scripts/check-all.sh

  native-targets:
    name: read native release targets
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, tovuk, linux, x64, public-trusted-ci]
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read native release target matrix
        id: matrix
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          def runner_for(triple):
              if triple.endswith("apple-darwin"):
                  return {"arch": "ARM64", "os": "macOS"}
              return {"arch": "x64", "os": "linux"}

          def build_strategy(triple):
              if triple == "aarch64-unknown-linux-gnu":
                  return "cargo-zigbuild"
              if triple.endswith("windows-msvc"):
                  return "cargo-xwin"
              return "cargo"

          def build_target(triple):
              if triple == "aarch64-unknown-linux-gnu":
                  return f"{triple}.2.17"
              return triple

          with open("native-release-targets.json", encoding="utf-8") as handle:
              targets = json.load(handle)["targets"]

          matrix = {
              "include": [
                  {
                      "asset_ext": target["asset_ext"],
                      "binary": target["binary"],
                      "build_strategy": build_strategy(target["triple"]),
                      "build_target": build_target(target["triple"]),
                      "runner": target["runner"],
                      "runner_arch": runner_for(target["triple"])["arch"],
                      "runner_os": runner_for(target["triple"])["os"],
                      "target": target["triple"],
                  }
                  for target in targets
              ]
          }
          print(f"matrix={json.dumps(matrix, separators=(',', ':'))}")
          PY

  build:
    name: build ${{ matrix.target }}
    needs: [native-targets, release-gate]
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-targets.outputs.matrix) }}
    runs-on: [self-hosted, tovuk, "${{ matrix.runner_os }}", "${{ matrix.runner_arch }}", public-trusted-ci]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Add Cargo tools to PATH
        shell: bash
        run: echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Check public release version contract
        shell: bash
        run: scripts/check-public-contracts.sh package-versions
      - name: Install CMake and Ninja for cross builds
        if: matrix.build_strategy == 'cargo-zigbuild' || matrix.build_strategy == 'cargo-xwin'
        shell: bash
        run: |
          cmake_version="4.3.3"
          cmake_root="$RUNNER_TEMP/cmake-$cmake_version"
          if ! command -v cmake >/dev/null 2>&1; then
            mkdir -p "$cmake_root"
            curl -fsSL \
              "https://github.com/Kitware/CMake/releases/download/v$cmake_version/cmake-$cmake_version-linux-x86_64.tar.gz" \
              -o "$RUNNER_TEMP/cmake.tar.gz"
            tar -xzf "$RUNNER_TEMP/cmake.tar.gz" --strip-components=1 -C "$cmake_root"
            echo "$cmake_root/bin" >> "$GITHUB_PATH"
            export PATH="$cmake_root/bin:$PATH"
          fi

          ninja_version="1.13.2"
          ninja_root="$RUNNER_TEMP/ninja-$ninja_version"
          if ! command -v ninja >/dev/null 2>&1; then
            mkdir -p "$ninja_root"
            curl -fsSL \
              "https://github.com/ninja-build/ninja/releases/download/v$ninja_version/ninja-linux.zip" \
              -o "$RUNNER_TEMP/ninja.zip"
            python3 - "$RUNNER_TEMP/ninja.zip" "$ninja_root" <<'PY'
          import sys
          import zipfile

          archive, destination = sys.argv[1:]
          with zipfile.ZipFile(archive) as handle:
              handle.extractall(destination)
          PY
            chmod +x "$ninja_root/ninja"
            echo "$ninja_root" >> "$GITHUB_PATH"
            export PATH="$ninja_root:$PATH"
          fi

          cmake --version
          ninja --version
      - name: Install Linux ARM64 Zig cross toolchain
        if: matrix.build_strategy == 'cargo-zigbuild'
        shell: bash
        run: |
          zig_version="0.16.0"
          zig_root="$RUNNER_TEMP/zig-$zig_version"
          if [ ! -x "$zig_root/zig" ]; then
            mkdir -p "$zig_root"
            curl -fsSL \
              "https://ziglang.org/download/$zig_version/zig-x86_64-linux-$zig_version.tar.xz" \
              -o "$RUNNER_TEMP/zig.tar.xz"
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$zig_root"
          fi
          echo "$zig_root" >> "$GITHUB_PATH"
          export PATH="$zig_root:$PATH"
          cargo install --locked cargo-zigbuild
          zig version
          cargo zigbuild --version
      - name: Install Windows MSVC cross toolchain
        if: matrix.build_strategy == 'cargo-xwin'
        shell: bash
        run: |
          llvm_version="22.1.8"
          llvm_root="$RUNNER_TEMP/llvm-$llvm_version"
          if [ ! -x "$llvm_root/bin/clang" ]; then
            mkdir -p "$llvm_root"
            curl -fsSL \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvm_version/LLVM-$llvm_version-Linux-X64.tar.xz" \
              -o "$RUNNER_TEMP/llvm.tar.xz"
            tar -xJf "$RUNNER_TEMP/llvm.tar.xz" --strip-components=1 -C "$llvm_root"
          fi
          echo "$llvm_root/bin" >> "$GITHUB_PATH"
          export PATH="$llvm_root/bin:$PATH"
          rustup component add llvm-tools
          cargo install --locked cargo-xwin
          clang --version
          cmake --version
          ninja --version
          cargo xwin --version
      - uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/registry
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('crates/tovuk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-registry-
      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' crates/tovuk/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Name release asset
        id: asset
        shell: bash
        run: |
          asset="tovuk-${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.asset_ext }}"
          echo "name=$asset" >> "$GITHUB_OUTPUT"
      - name: Check release asset
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          exists=false
          asset_exists=false
          checksum_exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            exists=true
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if grep -Fx "${{ steps.asset.outputs.name }}" <<<"$assets" >/dev/null; then
              asset_exists=true
            fi
            if grep -Fx "${{ steps.asset.outputs.name }}.sha256" <<<"$assets" >/dev/null; then
              checksum_exists=true
            fi
            if [ "$asset_exists" = "true" ]; then
              if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                echo "::error::${{ steps.asset.outputs.name }} already exists on $tag. Bump every public package version before pushing CLI changes."
                exit 1
              fi
              echo "::notice::${{ steps.asset.outputs.name }} already exists on $tag."
            else
              echo "::notice::$tag exists, building missing asset ${{ steps.asset.outputs.name }}."
            fi
          fi
          {
            printf 'tag=%s\n' "$tag"
            printf 'exists=%s\n' "$exists"
            printf 'asset_exists=%s\n' "$asset_exists"
            printf 'checksum_exists=%s\n' "$checksum_exists"
          } >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.release.outputs.asset_exists == 'false' && matrix.build_strategy == 'cargo'
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" --manifest-path crates/tovuk/Cargo.toml
      - name: Build Windows MSVC
        if: steps.release.outputs.asset_exists == 'false' && matrix.build_strategy == 'cargo-xwin'
        shell: bash
        run: cargo xwin build --locked --release --target "${{ matrix.target }}" --manifest-path crates/tovuk/Cargo.toml
      - name: Build Linux ARM64
        if: steps.release.outputs.asset_exists == 'false' && matrix.build_strategy == 'cargo-zigbuild'
        shell: bash
        run: cargo zigbuild --locked --release --target "${{ matrix.build_target }}" --manifest-path crates/tovuk/Cargo.toml
      - name: Prepare asset
        if: steps.release.outputs.asset_exists == 'false'
        shell: bash
        run: |
          binary_path="crates/tovuk/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ ! -f "$binary_path" ] && [ "${{ matrix.build_target }}" != "${{ matrix.target }}" ]; then
            binary_path="crates/tovuk/target/${{ matrix.build_target }}/release/${{ matrix.binary }}"
          fi
          cp "$binary_path" "${{ steps.asset.outputs.name }}"
          chmod +x "${{ steps.asset.outputs.name }}" || true
      - name: Download existing asset for checksum
        if: steps.release.outputs.asset_exists == 'true' && steps.release.outputs.checksum_exists == 'false'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.release.outputs.tag }}" --pattern "${{ steps.asset.outputs.name }}" --clobber
      - name: Prepare checksum
        if: steps.release.outputs.asset_exists == 'false' || steps.release.outputs.checksum_exists == 'false'
        shell: bash
        env:
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          node - <<'NODE'
          const { createHash } = require('node:crypto')
          const { readFileSync, writeFileSync } = require('node:fs')
          const asset = process.env.ASSET
          const digest = createHash('sha256').update(readFileSync(asset)).digest('hex')
          writeFileSync(`${asset}.sha256`, `${digest}  ${asset}\n`, 'utf8')
          NODE
      - name: Prepare release artifact bundle
        shell: bash
        run: |
          mkdir -p native-artifact
          {
            printf 'tag=%s\n' "${{ steps.release.outputs.tag }}"
            printf 'asset_name=%s\n' "${{ steps.asset.outputs.name }}"
            printf 'asset_exists=%s\n' "${{ steps.release.outputs.asset_exists }}"
            printf 'checksum_exists=%s\n' "${{ steps.release.outputs.checksum_exists }}"
          } > native-artifact/status.env
          if [ -f "${{ steps.asset.outputs.name }}" ]; then
            cp "${{ steps.asset.outputs.name }}" native-artifact/
          fi
          if [ -f "${{ steps.asset.outputs.name }}.sha256" ]; then
            cp "${{ steps.asset.outputs.name }}.sha256" native-artifact/
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.target }}
          path: native-artifact
          if-no-files-found: error

  upload:
    name: upload ${{ matrix.target }}
    needs: [native-targets, release-gate, build]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, tovuk, linux, x64, public-trusted-ci]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-targets.outputs.matrix) }}
    steps:
      - name: Download build artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "native-${{ matrix.target }}" --dir native-artifact
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . native-artifact/status.env

          if [ "$asset_exists" = "true" ] && [ "$checksum_exists" = "true" ]; then
            echo "$asset_name and checksum already exist on $tag."
            exit 0
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Native Tovuk CLI release $tag" \
              || gh release view "$tag" >/dev/null
          fi

          if [ "$asset_exists" = "false" ]; then
            gh release upload "$tag" "native-artifact/$asset_name" "native-artifact/$asset_name.sha256"
          elif [ "$checksum_exists" = "false" ]; then
            gh release upload "$tag" "native-artifact/$asset_name.sha256"
          fi
      - name: Verify release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . native-artifact/status.env
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          grep -Fx "$asset_name" <<<"$assets"
          grep -Fx "$asset_name.sha256" <<<"$assets"
