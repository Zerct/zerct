name: Publish native binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crates/tovuk/Cargo.toml"
      - "crates/tovuk/Cargo.lock"
      - "crates/tovuk/src/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: tovuk
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            binary: tovuk
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: tovuk
          - runner: macos-15
            target: x86_64-apple-darwin
            binary: tovuk
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: tovuk.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('crates/tovuk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-registry-
      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' crates/tovuk/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Name release asset
        id: asset
        shell: bash
        run: |
          asset="tovuk-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          case "${{ matrix.binary }}" in
            *.exe) asset="${asset}.exe" ;;
          esac
          echo "name=$asset" >> "$GITHUB_OUTPUT"
      - name: Check release asset
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if gh release view "$tag" --json assets --jq '.assets[].name' \
              | grep -Fx "${{ steps.asset.outputs.name }}" >/dev/null; then
              if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                echo "::error::${{ steps.asset.outputs.name }} already exists on $tag. Bump every public package version before pushing CLI changes."
                exit 1
              fi
              echo "asset_exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::${{ steps.asset.outputs.name }} already exists on $tag."
            else
              echo "asset_exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$tag exists, building missing asset ${{ steps.asset.outputs.name }}."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "asset_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.release.outputs.asset_exists == 'false'
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" --manifest-path crates/tovuk/Cargo.toml
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Prepare asset
        if: steps.release.outputs.asset_exists == 'false'
        shell: bash
        run: |
          cp "crates/tovuk/target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ steps.asset.outputs.name }}"
          chmod +x "${{ steps.asset.outputs.name }}" || true
      - name: Upload release asset
        if: steps.release.outputs.asset_exists == 'false'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Native Tovuk CLI release $tag" \
              || gh release view "$tag" >/dev/null
          fi
          gh release upload "$tag" "${{ steps.asset.outputs.name }}"
      - name: Verify release asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh release view "$tag" --json assets \
            --jq '.assets[].name' \
            | grep -Fx "${{ steps.asset.outputs.name }}"
