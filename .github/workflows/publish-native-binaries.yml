name: Publish native binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crates/tovuk/Cargo.toml"
      - "crates/tovuk/Cargo.lock"
      - "crates/tovuk/src/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: tovuk
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            binary: tovuk
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: tovuk
          - runner: macos-15
            target: x86_64-apple-darwin
            binary: tovuk
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: tovuk.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check public release version contract
        shell: bash
        run: scripts/check-public-contracts.sh package-versions
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('crates/tovuk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-registry-
      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' crates/tovuk/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Name release asset
        id: asset
        shell: bash
        run: |
          asset="tovuk-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          case "${{ matrix.binary }}" in
            *.exe) asset="${asset}.exe" ;;
          esac
          echo "name=$asset" >> "$GITHUB_OUTPUT"
      - name: Check release asset
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          exists=false
          asset_exists=false
          checksum_exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            exists=true
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if grep -Fx "${{ steps.asset.outputs.name }}" <<<"$assets" >/dev/null; then
              asset_exists=true
            fi
            if grep -Fx "${{ steps.asset.outputs.name }}.sha256" <<<"$assets" >/dev/null; then
              checksum_exists=true
            fi
            if [ "$asset_exists" = "true" ]; then
              if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                echo "::error::${{ steps.asset.outputs.name }} already exists on $tag. Bump every public package version before pushing CLI changes."
                exit 1
              fi
              echo "::notice::${{ steps.asset.outputs.name }} already exists on $tag."
            else
              echo "::notice::$tag exists, building missing asset ${{ steps.asset.outputs.name }}."
            fi
          fi
          {
            printf 'tag=%s\n' "$tag"
            printf 'exists=%s\n' "$exists"
            printf 'asset_exists=%s\n' "$asset_exists"
            printf 'checksum_exists=%s\n' "$checksum_exists"
          } >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.release.outputs.asset_exists == 'false'
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" --manifest-path crates/tovuk/Cargo.toml
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Prepare asset
        if: steps.release.outputs.asset_exists == 'false'
        shell: bash
        run: |
          cp "crates/tovuk/target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ steps.asset.outputs.name }}"
          chmod +x "${{ steps.asset.outputs.name }}" || true
      - name: Download existing asset for checksum
        if: steps.release.outputs.asset_exists == 'true' && steps.release.outputs.checksum_exists == 'false'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.release.outputs.tag }}" --pattern "${{ steps.asset.outputs.name }}" --clobber
      - name: Prepare checksum
        if: steps.release.outputs.asset_exists == 'false' || steps.release.outputs.checksum_exists == 'false'
        shell: bash
        env:
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          node - <<'NODE'
          const { createHash } = require('node:crypto')
          const { readFileSync, writeFileSync } = require('node:fs')
          const asset = process.env.ASSET
          const digest = createHash('sha256').update(readFileSync(asset)).digest('hex')
          writeFileSync(`${asset}.sha256`, `${digest}  ${asset}\n`, 'utf8')
          NODE
      - name: Upload release asset
        if: steps.release.outputs.asset_exists == 'false'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Native Tovuk CLI release $tag" \
              || gh release view "$tag" >/dev/null
          fi
          gh release upload "$tag" "${{ steps.asset.outputs.name }}" "${{ steps.asset.outputs.name }}.sha256"
      - name: Upload checksum asset
        if: steps.release.outputs.asset_exists == 'true' && steps.release.outputs.checksum_exists == 'false'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" "${{ steps.asset.outputs.name }}.sha256"
      - name: Verify release asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          grep -Fx "${{ steps.asset.outputs.name }}" <<<"$assets"
          grep -Fx "${{ steps.asset.outputs.name }}.sha256" <<<"$assets"
