name: Publish native binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".cargo/config.toml"
      - ".github/workflows/publish-native-binaries.yml"
      - "native-release-targets.json"
      - "checks/Cargo.toml"
      - "checks/Cargo.lock"
      - "checks/src/bin/zig-linker-proxy.rs"
      - "crates/tovuk/.cargo/config.toml"
      - "crates/tovuk/Cargo.toml"
      - "crates/tovuk/Cargo.lock"
      - "crates/tovuk/src/**"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: release gate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: tovuk-public-linux-x64
    timeout-minutes: 75
    permissions:
      contents: read
      deployments: read # Verify the exact Mintlify deployment for the docs revision.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            checks/target
            crates/tovuk/target
          key: release-gate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
          version: "0.11.28"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - uses: ./.github/actions/setup-quality-tools
        if: runner.environment == 'github-hosted'
      - name: Check public release version contract
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- package-versions
      - name: Require an unpublished version before release mutation
        if: github.event_name == 'push'
        run: |
          version="$(cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-public-contracts -- public-version)"
          cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-release-availability -- "$version"
      - name: Wait for Mintlify docs synchronization and public readiness
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin deploy-mintlify-docs --
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOVUK_DOCS_CHECK_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TOVUK_DOCS_REVISION: ${{ github.sha }}
      - name: Run full repository check
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-all --

  native-targets:
    name: read native release targets
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: tovuk-public-linux-x64
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Read native release target matrix
        id: matrix
        shell: bash
        run: |
          matrix="$(cargo run --locked --quiet --release --manifest-path checks/Cargo.toml \
            --bin native-release-tool -- matrix native-release-targets.json crates/tovuk/Cargo.toml)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: [native-targets, release-gate]
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            crates/tovuk/target
          key: native-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('crates/tovuk/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install pinned Rust release target
        if: matrix.runner != 'tovuk-public-linux-x64'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"
      - name: Verify immutable Linux Rust release target
        if: matrix.runner == 'tovuk-public-linux-x64'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustc --print target-libdir --target "$TARGET"
      - name: Add Cargo tools to PATH
        shell: bash
        run: echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Install CMake and Ninja for cross builds
        if: matrix.build_strategy == 'cargo-zigbuild'
        shell: bash
        run: |
          cmake_version="4.3.3"
          cmake_root="$RUNNER_TEMP/cmake-$cmake_version"
          mkdir -p "$cmake_root"
          cmake_sha256="927b2368a946c37269c3a66225ab00544e756459cdd0b5d0da438694fb9ff802"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "https://github.com/Kitware/CMake/releases/download/v$cmake_version/cmake-$cmake_version-linux-x86_64.tar.gz" \
            -o "$RUNNER_TEMP/cmake.tar.gz"
          cargo run --locked --quiet --release --manifest-path checks/Cargo.toml \
            --bin native-release-tool -- verify-sha256 "$RUNNER_TEMP/cmake.tar.gz" "$cmake_sha256"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" --strip-components=1 -C "$cmake_root"
          echo "$cmake_root/bin" >> "$GITHUB_PATH"
          export PATH="$cmake_root/bin:$PATH"

          ninja_version="1.13.2"
          ninja_root="$RUNNER_TEMP/ninja-$ninja_version"
          mkdir -p "$ninja_root"
          ninja_sha256="5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "https://github.com/ninja-build/ninja/releases/download/v$ninja_version/ninja-linux.zip" \
            -o "$RUNNER_TEMP/ninja.zip"
          cargo run --locked --quiet --release --manifest-path checks/Cargo.toml \
            --bin native-release-tool -- verify-sha256 "$RUNNER_TEMP/ninja.zip" "$ninja_sha256"
          unzip -q "$RUNNER_TEMP/ninja.zip" -d "$ninja_root"
          chmod +x "$ninja_root/ninja"
          echo "$ninja_root" >> "$GITHUB_PATH"
          export PATH="$ninja_root:$PATH"

          cmake --version
          ninja --version
      - name: Install Linux ARM64 Zig cross toolchain
        if: matrix.build_strategy == 'cargo-zigbuild'
        shell: bash
        run: |
          zig_version="0.16.0"
          zig_root="$RUNNER_TEMP/zig-$zig_version"
          mkdir -p "$zig_root"
          zig_sha256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "https://ziglang.org/download/$zig_version/zig-x86_64-linux-$zig_version.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          cargo run --locked --quiet --release --manifest-path checks/Cargo.toml \
            --bin native-release-tool -- verify-sha256 "$RUNNER_TEMP/zig.tar.xz" "$zig_sha256"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$zig_root"
          echo "$zig_root" >> "$GITHUB_PATH"
          export PATH="$zig_root:$PATH"
          cargo install --locked --version 0.23.0 cargo-zigbuild
          cargo build --locked --release --manifest-path checks/Cargo.toml --bin zig-linker-proxy
          proxy="$GITHUB_WORKSPACE/checks/target/release/zig-linker-proxy"
          TOVUK_REAL_ZIG_PATH="$zig_root/zig" "$proxy" version
          zig version
          cargo zigbuild --help >/dev/null
      - name: Build
        if: matrix.build_strategy == 'cargo'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" --manifest-path crates/tovuk/Cargo.toml
      - name: Build Linux ARM64
        if: matrix.build_strategy == 'cargo-zigbuild'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
          CARGO_ZIGBUILD_ZIG_PATH: ${{ github.workspace }}/checks/target/release/zig-linker-proxy
          TOVUK_REAL_ZIG_PATH: ${{ runner.temp }}/zig-0.16.0/zig
        run: cargo zigbuild --locked --release --target "$BUILD_TARGET" --manifest-path crates/tovuk/Cargo.toml
      - name: Prepare asset
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          BINARY: ${{ matrix.binary }}
          BUILD_TARGET: ${{ matrix.build_target }}
          TARGET: ${{ matrix.target }}
        run: |
          binary_path="crates/tovuk/target/$TARGET/release/$BINARY"
          if [ ! -f "$binary_path" ] && [ "$BUILD_TARGET" != "$TARGET" ]; then
            binary_path="crates/tovuk/target/$BUILD_TARGET/release/$BINARY"
          fi
          cp "$binary_path" "$ASSET_NAME"
          chmod +x "$ASSET_NAME"
      - name: Prepare release artifact bundle
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          mkdir -p native-artifact
          cp "$ASSET_NAME" native-artifact/
      - name: Smoke test host-native CLI
        if: matrix.build_strategy == 'cargo'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          "crates/tovuk/target/$TARGET/release/$BINARY" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: native-artifact
          if-no-files-found: error

  publish-native:
    name: publish native release
    needs: [native-targets, release-gate, build]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: tovuk-public-linux-x64
    timeout-minutes: 20
    permissions:
      contents: write # Required to create the release and upload assets.
    outputs:
      release_ref: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            checks/target
          key: native-publish-${{ runner.os }}-${{ hashFiles('checks/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Add GitHub CLI to PATH
        shell: bash
        run: |
          gh_version="2.96.0"
          gh_root="$RUNNER_TEMP/gh-$gh_version"
          mkdir -p "$gh_root"
          gh_sha256="83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "https://github.com/cli/cli/releases/download/v$gh_version/gh_${gh_version}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/gh.tar.gz"
          cargo run --locked --quiet --release --manifest-path checks/Cargo.toml \
            --bin native-release-tool -- verify-sha256 "$RUNNER_TEMP/gh.tar.gz" "$gh_sha256"
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" --strip-components=1 -C "$gh_root"
          echo "$gh_root/bin" >> "$GITHUB_PATH"
          "$gh_root/bin/gh" --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          merge-multiple: true
          path: native-artifact
      - name: Verify synchronized public package versions
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- package-versions
      - name: Prepare exact native asset set and checksums
        run: cargo run --locked --quiet --release --manifest-path checks/Cargo.toml --bin native-release-tool -- prepare-release native-artifact native-release-targets.json crates/tovuk/Cargo.toml
      - name: Read release tag
        id: metadata
        run: |
          tag="$(cargo run --locked --quiet --release --manifest-path checks/Cargo.toml \
            --bin native-release-tool -- tag crates/tovuk/Cargo.toml)"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Check immutable release state
        id: release_state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          api_optional() {
            local endpoint="$1"
            local output="$2"
            local error_file="$3"
            if gh api "$endpoint" >"$output" 2>"$error_file"; then
              return 0
            fi
            if grep -Fq '(HTTP 404)' "$error_file"; then
              : >"$output"
              return 4
            fi
            cat "$error_file" >&2
            return 1
          }

          tag_exists=false
          if api_optional "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            "$RUNNER_TEMP/tag.json" "$RUNNER_TEMP/tag-error.txt"; then
            tag_exists=true
            tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type + " " + .object.sha')"
            read -r tag_type tag_target <<<"$tag_ref"
            if [ "$tag_type" = "tag" ]; then
              tag_target="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_target" --jq '.object.sha')"
            fi
            if [ "$tag_target" != "$GITHUB_SHA" ]; then
              echo "::error::$RELEASE_TAG points to $tag_target, expected triggering commit $GITHUB_SHA."
              exit 1
            fi
          else
            tag_status="$?"
            if [ "$tag_status" -ne 4 ]; then
              exit "$tag_status"
            fi
          fi

          release_exists=false
          if api_optional "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release-error.txt"; then
            release_exists=true
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq '.assets[].name' >"$RUNNER_TEMP/remote-assets.txt"
          else
            release_status="$?"
            if [ "$release_status" -ne 4 ]; then
              exit "$release_status"
            fi
            : >"$RUNNER_TEMP/remote-assets.txt"
          fi
          if [ "$release_exists" = "true" ] && [ "$tag_exists" = "false" ]; then
            echo "::error::$RELEASE_TAG has a release without an immutable tag."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && \
            { [ "$release_exists" = "true" ] || [ "$tag_exists" = "true" ]; }; then
            echo "::error::$RELEASE_TAG already exists. Bump every public package version before pushing CLI changes."
            exit 1
          fi
          printf 'release_exists=%s\n' "$release_exists" >> "$GITHUB_OUTPUT"
      - name: Create or resume one atomic native release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EXISTS: ${{ steps.release_state.outputs.release_exists }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EXISTS" = "false" ]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" \
              --notes "Native Tovuk CLI release $RELEASE_TAG" --target "$GITHUB_SHA" --draft
          fi

          upload=()
          while IFS= read -r asset_name; do
            asset_exists=false
            checksum_exists=false
            if grep -Fx "$asset_name" "$RUNNER_TEMP/remote-assets.txt" >/dev/null; then
              asset_exists=true
            fi
            if grep -Fx "$asset_name.sha256" "$RUNNER_TEMP/remote-assets.txt" >/dev/null; then
              checksum_exists=true
            fi
            if [ "$asset_exists" = "false" ] && [ "$checksum_exists" = "true" ]; then
              echo "::error::$RELEASE_TAG has orphan checksum $asset_name.sha256."
              exit 1
            fi
            if [ "$asset_exists" = "false" ]; then
              upload+=("native-artifact/$asset_name" "native-artifact/$asset_name.sha256")
            elif [ "$checksum_exists" = "false" ]; then
              cp "native-artifact/$asset_name" "$RUNNER_TEMP/$asset_name.built"
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset_name" --dir native-artifact --clobber
              cmp -- "$RUNNER_TEMP/$asset_name.built" "native-artifact/$asset_name"
              cargo run --locked --quiet --release --manifest-path checks/Cargo.toml \
                --bin native-release-tool -- write-sha256 "native-artifact/$asset_name"
              upload+=("native-artifact/$asset_name.sha256")
            fi
          done < <(cargo run --locked --quiet --release --manifest-path checks/Cargo.toml \
            --bin native-release-tool -- asset-names native-release-targets.json crates/tovuk/Cargo.toml)

          if [ "${#upload[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${upload[@]}"
          fi
          cargo run --locked --quiet --release --manifest-path checks/Cargo.toml \
            --bin check-native-release-assets -- "${RELEASE_TAG#v}" 0 --allow-draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          cargo run --locked --quiet --release --manifest-path checks/Cargo.toml \
            --bin check-native-release-assets -- "${RELEASE_TAG#v}"

  publish-packages:
    name: publish registry packages
    needs: publish-native
    runs-on: tovuk-public-linux-x64
    timeout-minutes: 75
    permissions:
      actions: write # Dispatch and monitor the credential-isolated recovery workflow.
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_REF: ${{ needs.publish-native.outputs.release_ref }}
    steps:
      - name: Install pinned GitHub CLI
        shell: bash
        run: |
          gh_version="2.96.0"
          gh_root="$RUNNER_TEMP/gh-$gh_version"
          mkdir -p "$gh_root"
          gh_sha256="83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "https://github.com/cli/cli/releases/download/v$gh_version/gh_${gh_version}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/gh.tar.gz"
          printf '%s  %s\n' "$gh_sha256" "$RUNNER_TEMP/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" --strip-components=1 -C "$gh_root"
          echo "$gh_root/bin" >> "$GITHUB_PATH"
          "$gh_root/bin/gh" --version
      - name: Dispatch and wait for package recovery
        shell: bash
        run: |
          request_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          title="Recover public packages $RELEASE_REF via $request_id"
          dispatch_succeeded=false
          for delay in 0 2 4 8 15; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            if gh workflow run recover-publication.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_REF" \
              -f "release_ref=$RELEASE_REF" -f "request_id=$request_id"; then
              dispatch_succeeded=true
              break
            fi
          done
          if [ "$dispatch_succeeded" = "false" ]; then
            echo "Recovery dispatch response remained unsuccessful; checking for an accepted run." >&2
          fi

          recovery_run_ids=()
          for delay in 1 2 4 8 15 30; do
            sleep "$delay"
            if ! candidate_run_ids="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow recover-publication.yml --event workflow_dispatch \
              --commit "$RELEASE_COMMIT" --limit 20 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"$title\") | .databaseId")"; then
              continue
            fi
            recovery_run_ids=()
            while IFS= read -r candidate_run_id; do
              if [ -z "$candidate_run_id" ]; then
                continue
              fi
              if [[ ! "$candidate_run_id" =~ ^[0-9]+$ ]]; then
                echo "Invalid recovery run identifier: $candidate_run_id" >&2
                exit 1
              fi
              recovery_run_ids+=("$candidate_run_id")
            done <<< "$candidate_run_ids"
            if [ "${#recovery_run_ids[@]}" -gt 0 ]; then
              break
            fi
          done
          if [ "${#recovery_run_ids[@]}" -eq 0 ]; then
            echo "Unable to locate dispatched package recovery workflow" >&2
            exit 1
          fi
          recovery_failed=false
          for recovery_run_id in "${recovery_run_ids[@]}"; do
            if ! gh run watch "$recovery_run_id" --repo "$GITHUB_REPOSITORY" \
              --exit-status --interval 10; then
              recovery_failed=true
            fi
          done
          if [ "$recovery_failed" = "true" ]; then
            echo "At least one package recovery workflow failed" >&2
            exit 1
          fi
