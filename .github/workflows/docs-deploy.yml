name: Check Mintlify docs sync

on:
  push:
    branches:
      - main
    paths:
      - ".cargo/config.toml"
      - ".github/workflows/docs-deploy.yml"
      - "checks/**"
      - "docs/**"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    name: check docs sync
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check Mintlify GitHub App sync
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin deploy-mintlify-docs --
        env:
          TOVUK_DOCS_CHECK_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TOVUK_DOCS_REVISION: ${{ github.sha }}
