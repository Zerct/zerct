name: Publish npm package

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare npm package
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            checks/target
            crates/tovuk/target
          key: npm-prepare-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Sync generated native target manifests
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin sync-native-release-targets -- --check
      - name: Check public release version contract
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- package-versions
      - name: Check registry version
        id: version
        run: |
          version="$(cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- public-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          status="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/tovuk-npm.json" -w '%{http_code}' \
            -H 'Accept: application/json' \
            -H 'User-Agent: Tovuk publish workflow (https://github.com/tovuk/tovuk)' \
            "https://registry.npmjs.org/tovuk/$version")"
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tovuk@$version already exists; skipping publish."
          elif [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected npm registry status: $status" >&2
            cat "$RUNNER_TEMP/tovuk-npm.json" >&2
            exit 1
          fi
      - name: Install package dependencies
        if: steps.version.outputs.exists == 'false'
        run: npm ci --ignore-scripts
        working-directory: packages/tovuk
      - name: Build native CLI for package checks
        if: steps.version.outputs.exists == 'false'
        run: cargo build --locked --release --manifest-path crates/tovuk/Cargo.toml
      - name: Check package
        if: steps.version.outputs.exists == 'false'
        run: npm run check
        working-directory: packages/tovuk
        env:
          TOVUK_NATIVE_BINARY: ${{ github.workspace }}/crates/tovuk/target/release/tovuk
      - name: Verify native release assets
        if: steps.version.outputs.exists == 'false'
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-native-release-assets -- "$VERSION"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
      - name: Pack npm package artifact
        if: steps.version.outputs.exists == 'false'
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/tovuk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.exists == 'false'
        with:
          name: tovuk-npm-package
          path: ${{ runner.temp }}/tovuk-*.tgz
          if-no-files-found: error

  publish:
    name: publish tovuk to npm
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing.
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tovuk-npm-package
          path: npm-package
      - name: Publish package with npm trusted publishing
        run: |
          mapfile -t tarballs < <(find npm-package -type f -name 'tovuk-*.tgz' | sort)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            printf 'Expected exactly one npm tarball, found %s:\n' "${#tarballs[@]}" >&2
            find npm-package -maxdepth 3 -type f -print >&2
            exit 1
          fi
          npm publish "$(realpath "${tarballs[0]}")" --access public
      - name: Verify npm package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for delay in 0 10 10 15 15 20 20 30 30 30; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            published=""
            if registry_version="$(npm view "tovuk@$VERSION" version --registry=https://registry.npmjs.org 2>/dev/null)"; then
              published="$registry_version"
            fi
            if [ "$published" = "$VERSION" ]; then
              exit 0
            fi
          done
          echo "tovuk@$VERSION was not visible on npm after publish" >&2
          exit 1
