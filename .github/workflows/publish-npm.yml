name: Publish npm package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/zerct/package.json"

permissions:
  contents: read

jobs:
  publish:
    name: publish zerct to npm
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check unscoped publishing gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${ENABLE_UNSCOPED_NPM_PUBLISH:-}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping unscoped npm publish. Set ENABLE_UNSCOPED_NPM_PUBLISH=true after npm approves zerct."
          fi
        env:
          ENABLE_UNSCOPED_NPM_PUBLISH: ${{ vars.ENABLE_UNSCOPED_NPM_PUBLISH }}
      - name: Check registry version
        id: version
        if: steps.gate.outputs.enabled == 'true'
        run: |
          version="$(node -p "require('./packages/zerct/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "zerct@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::zerct@$version already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install package dependencies
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false'
        run: npm ci
        working-directory: packages/zerct
      - name: Check package
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false'
        run: npm run check
        working-directory: packages/zerct
      - if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false'
        run: npm publish --access public
        working-directory: packages/zerct
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
