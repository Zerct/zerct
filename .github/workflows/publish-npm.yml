name: Publish npm package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/tovuk/package.json"
      - "packages/tovuk/install.mjs"
      - "packages/tovuk/bin/tovuk"
      - "crates/tovuk/**"
      - "scripts/check-public-contracts.go"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish tovuk to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/tovuk/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            crates/tovuk/target
          key: ${{ runner.os }}-cargo-tovuk-npm-${{ hashFiles('crates/tovuk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tovuk-npm-
      - name: Check unscoped publishing gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${ENABLE_UNSCOPED_NPM_PUBLISH:-}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping unscoped npm publish. Set ENABLE_UNSCOPED_NPM_PUBLISH=true after npm approves tovuk."
          fi
        env:
          ENABLE_UNSCOPED_NPM_PUBLISH: ${{ vars.ENABLE_UNSCOPED_NPM_PUBLISH }}
      - name: Check registry version
        id: version
        if: steps.gate.outputs.enabled == 'true'
        run: |
          version="$(go run scripts/check-public-contracts.go npm-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "tovuk@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tovuk@$version already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install package dependencies
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false'
        run: npm ci --ignore-scripts
        working-directory: packages/tovuk
      - name: Build native CLI for package checks
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false'
        run: cargo build --locked --release --manifest-path crates/tovuk/Cargo.toml
      - name: Check package
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false'
        run: npm run check
        working-directory: packages/tovuk
        env:
          TOVUK_NATIVE_BINARY: ${{ github.workspace }}/crates/tovuk/target/release/tovuk
      - if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false'
        run: npm publish --access public
        working-directory: packages/tovuk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm package
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          for delay in 0 10 10 10 10 10; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            published="$(npm view "tovuk@$version" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              exit 0
            fi
          done
          echo "tovuk@$version was not visible on npm after publish" >&2
          exit 1
