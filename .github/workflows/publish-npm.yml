name: Publish npm package

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish native binaries
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish tovuk to npm
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check public release version contract
        run: scripts/check-public-contracts.sh package-versions
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            crates/tovuk/target
          key: ${{ runner.os }}-cargo-tovuk-npm-${{ hashFiles('crates/tovuk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tovuk-npm-
      - name: Check registry version
        id: version
        run: |
          version="$(./scripts/check-public-contracts.sh npm-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "tovuk@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::tovuk@$version already exists on npm. Bump every public package version before pushing CLI changes."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tovuk@$version already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install package dependencies
        if: steps.version.outputs.exists == 'false'
        run: npm ci --ignore-scripts
        working-directory: packages/tovuk
      - name: Build native CLI for package checks
        if: steps.version.outputs.exists == 'false'
        run: cargo build --locked --release --manifest-path crates/tovuk/Cargo.toml
      - name: Check package
        if: steps.version.outputs.exists == 'false'
        run: npm run check
        working-directory: packages/tovuk
        env:
          TOVUK_NATIVE_BINARY: ${{ github.workspace }}/crates/tovuk/target/release/tovuk
      - name: Verify native release assets
        if: steps.version.outputs.exists == 'false'
        run: ./scripts/check-native-release-assets.sh "${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish package with npm trusted publishing
        if: steps.version.outputs.exists == 'false'
        run: npm publish --access public
        working-directory: packages/tovuk
      - name: Verify npm package
        if: steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          for delay in 0 10 10 10 10 10; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            published="$(npm view "tovuk@$version" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              exit 0
            fi
          done
          echo "tovuk@$version was not visible on npm after publish" >&2
          exit 1
