name: Publish npm package

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish native binaries
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish tovuk to npm
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/tovuk/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Check public release version contract
        run: scripts/check-public-contracts.sh package-versions
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            crates/tovuk/target
          key: ${{ runner.os }}-cargo-tovuk-npm-${{ hashFiles('crates/tovuk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tovuk-npm-
      - name: Check unscoped publishing gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${ENABLE_UNSCOPED_NPM_PUBLISH:-}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping unscoped npm publish. Set ENABLE_UNSCOPED_NPM_PUBLISH=true after npm approves tovuk."
          fi
        env:
          ENABLE_UNSCOPED_NPM_PUBLISH: ${{ vars.ENABLE_UNSCOPED_NPM_PUBLISH }}
      - name: Check registry version
        id: version
        if: steps.gate.outputs.enabled == 'true'
        run: |
          version="$(./scripts/check-public-contracts.sh npm-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "tovuk@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::tovuk@$version already exists on npm. Bump every public package version before pushing CLI changes."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tovuk@$version already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select npm publish auth
        id: publish_auth
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false'
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${NPM_TRUSTED_PUBLISHING_ENABLED:-}" = "true" ]; then
            echo "method=trusted" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "method=skip" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping npm publish for tovuk. Configure NPM_TOKEN or enable trusted publishing for package tovuk with owner tovuk, repository tovuk, workflow publish-npm.yml, environment npm, then set NPM_TRUSTED_PUBLISHING_ENABLED=true."
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHING_ENABLED: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED }}
      - name: Install package dependencies
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false' && steps.publish_auth.outputs.method != 'skip'
        run: npm ci --ignore-scripts
        working-directory: packages/tovuk
      - name: Build native CLI for package checks
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false' && steps.publish_auth.outputs.method != 'skip'
        run: cargo build --locked --release --manifest-path crates/tovuk/Cargo.toml
      - name: Check package
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false' && steps.publish_auth.outputs.method != 'skip'
        run: npm run check
        working-directory: packages/tovuk
        env:
          TOVUK_NATIVE_BINARY: ${{ github.workspace }}/crates/tovuk/target/release/tovuk
      - name: Verify native release assets
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false' && steps.publish_auth.outputs.method != 'skip'
        run: ./scripts/check-native-release-assets.sh "${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish package with npm token
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false' && steps.publish_auth.outputs.method == 'token'
        run: npm publish --access public
        working-directory: packages/tovuk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish package with npm trusted publishing
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false' && steps.publish_auth.outputs.method == 'trusted'
        run: npm publish --access public
        working-directory: packages/tovuk
      - name: Verify npm package
        if: steps.gate.outputs.enabled == 'true' && steps.version.outputs.exists == 'false' && steps.publish_auth.outputs.method != 'skip'
        run: |
          version="${{ steps.version.outputs.version }}"
          for delay in 0 10 10 10 10 10; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            published="$(npm view "tovuk@$version" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              exit 0
            fi
          done
          echo "tovuk@$version was not visible on npm after publish" >&2
          exit 1
