name: Publish npm package

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish native binaries
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare npm package
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync generated native target manifests
        run: scripts/sync-native-release-targets.sh
      - name: Check public release version contract
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- package-versions
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            crates/tovuk/target
          key: ${{ runner.os }}-cargo-tovuk-npm-${{ hashFiles('crates/tovuk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tovuk-npm-
      - name: Check registry version
        id: version
        run: |
          version="$(cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- npm-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "tovuk@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::tovuk@$version already exists on npm. Bump every public package version before pushing CLI changes."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tovuk@$version already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install package dependencies
        if: steps.version.outputs.exists == 'false'
        run: npm ci --ignore-scripts
        working-directory: packages/tovuk
      - name: Build native CLI for package checks
        if: steps.version.outputs.exists == 'false'
        run: cargo build --locked --release --manifest-path crates/tovuk/Cargo.toml
      - name: Check package
        if: steps.version.outputs.exists == 'false'
        run: npm run check
        working-directory: packages/tovuk
        env:
          TOVUK_NATIVE_BINARY: ${{ github.workspace }}/crates/tovuk/target/release/tovuk
      - name: Verify native release assets
        if: steps.version.outputs.exists == 'false'
        run: ./scripts/check-native-release-assets.sh "${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Pack npm package artifact
        if: steps.version.outputs.exists == 'false'
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/tovuk
      - uses: actions/upload-artifact@v6
        if: steps.version.outputs.exists == 'false'
        with:
          name: tovuk-npm-package
          path: ${{ runner.temp }}/tovuk-*.tgz
          if-no-files-found: error

  publish:
    name: publish tovuk to npm
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: tovuk-npm-package
          path: npm-package
      - name: Publish package with npm trusted publishing
        run: |
          mapfile -t tarballs < <(find npm-package -type f -name 'tovuk-*.tgz' | sort)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            printf 'Expected exactly one npm tarball, found %s:\n' "${#tarballs[@]}" >&2
            find npm-package -maxdepth 3 -type f -print >&2
            exit 1
          fi
          npm publish "$(realpath "${tarballs[0]}")" --access public
      - name: Verify npm package
        run: |
          version="${{ needs.prepare.outputs.version }}"
          for delay in 0 10 10 15 15 20 20 30 30 30; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            published="$(npm view "tovuk@$version" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              exit 0
            fi
          done
          echo "tovuk@$version was not visible on npm after publish" >&2
          exit 1
