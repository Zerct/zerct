name: Publish npm package
run-name: Publish npm ${{ inputs.release_ref }} via ${{ inputs.orchestration_id }}

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact existing release tag, such as v0.1.117
        required: true
        type: string
      release_commit:
        description: Exact 40-hex commit resolved from the release tag
        required: true
        type: string
      orchestration_id:
        description: Unique numeric recovery run and attempt identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            checks/target
            crates/tovuk/target
          key: npm-prepare-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Sync generated native target manifests
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin sync-native-release-targets -- --check
      - name: Resolve exact native release source
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RELEASE_REF: ${{ inputs.release_ref }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          ORCHESTRATION_ID: ${{ inputs.orchestration_id }}
        run: |
          cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-public-contracts -- package-versions
          version="$(cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-public-contracts -- public-version)"
          release_ref="$INPUT_RELEASE_REF"
          if [ "$release_ref" != "v$version" ]; then
            echo "Release ref $release_ref does not match public version v$version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$release_ref" ] || \
            [ "$GITHUB_SHA" != "$INPUT_RELEASE_COMMIT" ]; then
            echo "Workflow ref or commit does not match the requested release" >&2
            exit 1
          fi
          if [[ ! "$INPUT_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || \
            [[ ! "$ORCHESTRATION_ID" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "Release commit or orchestration identifier is invalid" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$release_ref:refs/tags/$release_ref"
          release_commit="$(git rev-parse "refs/tags/$release_ref^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [ "$release_commit" != "$INPUT_RELEASE_COMMIT" ] || \
            [ "$checkout_commit" != "$release_commit" ]; then
            echo "Release tag $release_ref did not resolve to the checked-out commit" >&2
            exit 1
          fi
          release_target="$(gh api --jq '.target_commitish' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$release_ref")"
          if [ "$release_target" != "$release_commit" ]; then
            echo "Release target $release_target does not match tag commit $release_commit" >&2
            exit 1
          fi
          cargo run --locked --quiet --manifest-path checks/Cargo.toml \
            --bin check-native-release-assets -- "$version"
          printf 'release_commit=%s\nversion=%s\n' "$release_commit" "$version" >> "$GITHUB_OUTPUT"
      - name: Check registry version
        id: version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          status=""
          for delay in 0 5 10 20 30 60; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            if ! candidate_status="$(curl -sS --connect-timeout 10 --max-time 30 \
              -o "$RUNNER_TEMP/tovuk-npm.json" -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H 'User-Agent: Tovuk publish workflow (https://github.com/tovuk/tovuk)' \
              "https://registry.npmjs.org/tovuk/$VERSION")"; then
              continue
            fi
            status="$candidate_status"
            case "$status" in
              200|404)
                break
                ;;
              429|5??)
                continue
                ;;
              *)
                break
                ;;
            esac
          done
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tovuk@$VERSION already exists; skipping publish."
          elif [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected npm registry status: $status" >&2
            cat "$RUNNER_TEMP/tovuk-npm.json" >&2
            exit 1
          fi
      - name: Install package dependencies
        if: steps.version.outputs.exists == 'false'
        run: npm ci --ignore-scripts
        working-directory: packages/tovuk
      - name: Build native CLI for package checks
        if: steps.version.outputs.exists == 'false'
        run: cargo build --locked --release --manifest-path crates/tovuk/Cargo.toml
      - name: Check package
        if: steps.version.outputs.exists == 'false'
        run: npm run check
        working-directory: packages/tovuk
        env:
          TOVUK_NATIVE_BINARY: ${{ github.workspace }}/crates/tovuk/target/release/tovuk
      - name: Verify native release assets
        if: steps.version.outputs.exists == 'false'
        run: cargo run --locked --quiet --manifest-path checks/Cargo.toml --bin check-native-release-assets -- "$VERSION"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
      - name: Pack npm package artifact
        if: steps.version.outputs.exists == 'false'
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/tovuk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.exists == 'false'
        with:
          name: tovuk-npm-package
          path: ${{ runner.temp }}/tovuk-*.tgz
          if-no-files-found: error

  publish:
    name: publish tovuk to npm
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing.
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tovuk-npm-package
          path: npm-package
      - name: Publish package with npm trusted publishing
        run: |
          mapfile -t tarballs < <(find npm-package -type f -name 'tovuk-*.tgz' | sort)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            printf 'Expected exactly one npm tarball, found %s:\n' "${#tarballs[@]}" >&2
            find npm-package -maxdepth 3 -type f -print >&2
            exit 1
          fi
          npm publish "$(realpath "${tarballs[0]}")" --access public

  verify:
    name: verify npm package
    needs:
      - prepare
      - publish
    if: ${{ always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify npm package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for delay in 0 10 10 15 15 20 20 30 30 30; do
            if [ "$delay" != 0 ]; then
              sleep "$delay"
            fi
            published=""
            if registry_version="$(npm view "tovuk@$VERSION" version --registry=https://registry.npmjs.org 2>/dev/null)"; then
              published="$registry_version"
            fi
            if [ "$published" = "$VERSION" ]; then
              exit 0
            fi
          done
          echo "tovuk@$VERSION was not visible on npm after publish" >&2
          exit 1
