name: Publish scoped npm package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/zerct/package.json"

permissions:
  contents: read

jobs:
  publish:
    name: publish @zerct/zerct to npm
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check registry version
        id: version
        run: |
          version="$(node -p "require('./packages/zerct/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "@zerct/zerct@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@zerct/zerct@$version already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists == 'false'
        run: ./scripts/check-all.sh
      - if: steps.version.outputs.exists == 'false'
        run: ./scripts/publish-npm-scoped.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
