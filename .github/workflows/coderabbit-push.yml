name: CodeRabbit push review

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: coderabbit push review
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check CodeRabbit API key
        id: key
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
        run: |
          if [ -z "${CODERABBIT_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping push review. CodeRabbit headless CLI requires CODERABBIT_API_KEY from an Agentic API key."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install CodeRabbit CLI
        if: steps.key.outputs.available == 'true'
        run: |
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/coderabbit" --version

      - name: Review pushed changes
        if: steps.key.outputs.available == 'true'
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base_sha="${PUSH_BASE_SHA:-}"
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD~1)"
          fi

          git branch coderabbit-base "$base_sha"
          coderabbit review --api-key "$CODERABBIT_API_KEY" --plain --base coderabbit-base
