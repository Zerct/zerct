[registries.crates-io]
protocol = "sparse"

[build]
warnings = "deny"

[future-incompat-report]
frequency = "always"

[net]
retry = 5

[resolver]
incompatible-rust-versions = "fallback"

[http]
timeout = 120

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "11.0", force = true }

# Use Rust's bundled silent COFF linker for the standalone Windows executable.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=lld-link", "-C", "link-arg=/NOIMPLIB"]
