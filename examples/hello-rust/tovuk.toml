name = "hello-rust"
kind = "rust_worker"

[capabilities]
static_frontend = false
worker = true
sqlite = false
object_storage = false
kv = false
state = false
queue = false
cron = false
service_bindings = false
secrets = false
custom_domains = false
logs = true
builds = true
usage_caps = true
billing = true
support = true
abuse = true

[build]
command = "cargo build --release"

[run]
command = "./target/release/hello-rust"
port = 3000
health = "/healthz"

[resources]
memory = "128mb"
cpu = "1"
idle_timeout_minutes = 15
