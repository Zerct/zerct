[lints.rustdoc]
all = { level = "deny", priority = -1 }

[profile.dev]
debug-assertions = true
overflow-checks = true

[profile.release]
codegen-units = 1
debug-assertions = true
lto = "thin"
overflow-checks = true

[dependencies]
flate2 = { version = "1.1.9", default-features = false, features = [
  "rust_backend",
] }
http = { version = "1.4.2", default-features = false, features = ["std"] }
http-body-util = { version = "0.1.3", default-features = false }
hyper = { version = "1.10.1", default-features = false, features = [
  "client",
  "http1",
  "http2",
] }
hyper-rustls = { version = "0.27.9", default-features = false, features = [
  "http1",
  "http2",
  "native-tokio",
  "ring",
  "tls12",
] }
hyper-util = { version = "0.1.20", default-features = false, features = [
  "client-legacy",
  "http1",
  "http2",
  "tokio",
] }
rustls = { version = "0.23.41", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1.0.228", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.150", default-features = false, features = [
  "std",
] }
sha2 = { version = "0.11.0", default-features = false, features = [
  "alloc",
  "oid",
] }
tar = { version = "0.4.46", default-features = false }
# Keep Ring's locked Windows support coherent until its 0.52 requirement changes.
tokio = { version = "=1.53.1", default-features = false, features = [
  "net",
  "rt",
  "time",
] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
