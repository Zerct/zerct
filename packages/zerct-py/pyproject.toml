[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "zerct"
version = "0.1.19"
description = "Deploy Rust backends and static frontends to Zerct."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Zerct" }]
keywords = ["zerct", "rust", "deploy", "backend", "hosting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools"
]

[project.urls]
Homepage = "https://zerct.com"
Repository = "https://github.com/Zerct/zerct"
Issues = "https://github.com/Zerct/zerct/issues"

[project.scripts]
zerct = "zerct.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zerct"]
