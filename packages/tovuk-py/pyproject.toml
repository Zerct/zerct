[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tovuk"
version = "0.1.113"
description = "Use Tovuk scraper APIs from a native CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Tovuk" }]
keywords = ["tovuk", "rust", "scraper", "api", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://tovuk.com"
Repository = "https://github.com/tovuk/tovuk"
Issues = "https://github.com/tovuk/tovuk/issues"

[project.scripts]
tovuk = "tovuk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tovuk"]
