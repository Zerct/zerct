[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "tovuk"
version = "0.1.116"
description = "Use Tovuk scraper APIs from a native CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tovuk" }]
keywords = ["tovuk", "rust", "scraper", "api", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://tovuk.com"
Repository = "https://github.com/tovuk/tovuk"
Issues = "https://github.com/tovuk/tovuk/issues"

[project.scripts]
tovuk = "tovuk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tovuk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
# D203/D211 and D212/D213 are mutually exclusive; use D211 and D212. Ruff's
# formatter owns COM812 and ISC001. S606 is intrinsic to a launcher whose only
# runtime job is to exec the verified binary.
ignore = ["COM812", "D203", "D213", "ISC001", "S606"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
